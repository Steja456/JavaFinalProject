<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Favorite Movies</title></head>
<body>
<h1>Your Favorite Movies</h1>
<div th:each="movie : ${favorites}">
    <h3 th:text="${movie.title}"></h3>
    <img th:src="'https://image.tmdb.org/t/p/w200' + ${movie.posterPath}" />
    <form th:action="@{'/favorite/remove/' + ${movie.id}}" method="post">
        <button type="submit">Remove</button>
    </form>
</div>
</body>
</html>
